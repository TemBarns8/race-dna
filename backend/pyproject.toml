[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"

[project]
name = "race-dna-api"
version = "0.1.0"
description = "Explainable Formula 1 driver analytics API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.49,<0.50",
]
[project.optional-dependencies]
dev = [
    "httpx2>=2.5,<3",
    "pytest>=9,<10",
]
[tool.hatch.build.targets.wheel]
packages = ["src/race_dna"]