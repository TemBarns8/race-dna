[build-system]
requires = ["hatchling>=1.30,<2"]
build-backend = "hatchling.build"

[project]
name = "race-dna-api"
version = "0.1.0"
description = "Explainable Formula 1 driver analytics API"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<0.32",
    "fastapi>=0.139,<0.140",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "uvicorn[standard]>=0.49,<0.50",
    "httpx2>=2.5,<3",
]
[project.scripts]
race-dna = "race_dna.cli:main"
[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]
[tool.hatch.build.targets.wheel]
packages = ["src/race_dna"]